[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "surgmllm"
version = "0.1.0"
description = "Structured surgical reasoning and role-aware visual grounding"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSE_InternVL", "NOTICE", "THIRD_PARTY.md"]
dependencies = [
  "torch==2.10.0",
  "torchvision==0.25.0",
  "transformers==4.57.0",
  "peft==0.17.1",
  "xtuner==0.1.23",
  "mmengine==0.10.7",
  "deepspeed==0.18.5",
  "hydra-core==1.3.2",
  "omegaconf==2.3.0",
  "timm==1.0.17",
  "flash-attn==2.7.3",
  "pycocotools",
  "pillow",
  "numpy",
  "scipy",
  "scikit-learn",
]

[tool.setuptools.packages.find]
include = ["projects*", "third_parts*"]

[tool.setuptools.package-data]
"third_parts.sam2" = ["sam2_configs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
